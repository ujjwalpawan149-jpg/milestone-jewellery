<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milestone Jewellery Admin</title><style>
body{margin:0;background:#0b0b09;color:#eee;font:14px Arial;padding:20px}main{max-width:1100px;margin:auto}h1,h2{font-family:Georgia,serif;color:#e9c56b}input,button,select,textarea{background:#12120f;color:#eee;border:1px solid #4b3c25;padding:10px;margin:4px 0}button{cursor:pointer}.bar{display:flex;gap:8px;flex-wrap:wrap}.panel{border:1px solid #3b3020;padding:15px;margin:15px 0;background:#10100d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.table{overflow:auto}.row{display:grid;grid-template-columns:150px 1fr 120px 120px 130px;gap:8px;padding:8px;border-bottom:1px solid #29241b;min-width:700px}.muted{color:#9b958a;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<h1>Milestone Enterprises — Admin</h1>
<p class="muted">This page is intentionally not linked from the public site. Keep ADMIN_KEY secret.</p>
<div class="panel"><div class="bar"><input id="key" type="password" placeholder="ADMIN_KEY"><button id="save">Save key</button><button id="load">Load orders</button></div><div id="msg" class="muted"></div></div>
<div class="panel"><h2>Orders</h2><div id="orders">Enter the admin key and load orders.</div></div>
<div class="panel"><h2>Quick product editor</h2><div class="grid"><input id="pname" placeholder="Name"><input id="pslug" placeholder="slug"><input id="pcat" placeholder="Category"><input id="pmetal" placeholder="Metal"><input id="ppurity" placeholder="Purity"><input id="pweight" placeholder="Weight grams"><input id="pprice" placeholder="Price INR"><input id="pimage" placeholder="/assets/jewellery-1.svg"></div><textarea id="pdesc" rows="3" style="width:100%" placeholder="Description"></textarea><button id="add">Add product</button></div>
<script>
const $=s=>document.querySelector(s), key=()=>sessionStorage.getItem("mej_admin_key")||$("#key").value.trim();
$("#save").onclick=()=>{if($("#key").value.trim()){sessionStorage.setItem("mej_admin_key",$("#key").value.trim());$("#msg").textContent="Key saved for this browser tab."}};
async function api(url,opt={}){const res=await fetch(url,{headers:{"Content-Type":"application/json","x-admin-key":key()},...opt});const d=await res.json().catch(()=>({}));if(!res.ok)throw Error(d.error||"Request failed");return d}
async function load(){try{const rows=await api("/api/admin/orders");$("#orders").innerHTML=rows.length?rows.map(x=>`<div class="row"><b>${x.order_number}</b><span>${x.customer_name} · ${x.phone}</span><span>₹${Number(x.total_inr).toLocaleString("en-IN")}</span><span>${x.payment_status}</span><span><select data-no="${x.order_number}"><option ${x.order_status==="PLACED"?"selected":""}>PLACED</option><option ${x.order_status==="CONFIRMED"?"selected":""}>CONFIRMED</option><option ${x.order_status==="PROCESSING"?"selected":""}>PROCESSING</option><option ${x.order_status==="SHIPPED"?"selected":""}>SHIPPED</option><option ${x.order_status==="DELIVERED"?"selected":""}>DELIVERED</option><option ${x.order_status==="CANCELLED"?"selected":""}>CANCELLED</option></select></span></div>`).join(""):"No orders yet."}catch(e){$("#orders").textContent=e.message}}
$("#load").onclick=load;$("#add").onclick=async()=>{try{const d={name:$("#pname").value,slug:$("#pslug").value,category:$("#pcat").value,metal:$("#pmetal").value,purity:$("#ppurity").value,weight_grams:$("#pweight").value,price_inr:$("#pprice").value,image_url:$("#pimage").value,description:$("#pdesc").value};await api("/api/admin/products",{method:"POST",body:JSON.stringify(d)});$("#msg").textContent="Product added.";["pname","pslug","pcat","pmetal","ppurity","pweight","pprice","pimage","pdesc"].forEach(x=>$("#"+x).value="")}catch(e){$("#msg").textContent=e.message}};
document.addEventListener("change",async e=>{if(e.target.matches("select[data-no]")){try{await api("/api/admin/orders/"+encodeURIComponent(e.target.dataset.no),{method:"PATCH",body:JSON.stringify({status:e.target.value})});$("#msg").textContent="Order updated."}catch(err){$("#msg").textContent=err.message}}});
if(sessionStorage.getItem("mej_admin_key")){$("#key").value=sessionStorage.getItem("mej_admin_key");load()}
</script></main></body></html>
